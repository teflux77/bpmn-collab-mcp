# Production stack on the VPS: the app behind Caddy (automatic HTTPS, HTTP-01).
# Run from the repo checkout with the server-side env file (never committed):
#   docker compose -f deploy/docker-compose.yml --env-file /opt/bpmn-collab/.env up -d
# Another project = another service on the `web` network + a file in deploy/sites/.
name: bpmn-collab

services:
  app:
    image: ghcr.io/teflux77/bpmn-collab-mcp:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${BPMN_HOST:?set BPMN_HOST}
      DATA_DIR: /data
      # OAuth on /mcp: empty OAUTH_ISSUER = disabled (docs/deploy.md, "OAuth")
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_ALLOWED_USERS: ${OAUTH_ALLOWED_USERS:-}
    volumes:
      - bpmn-data:/data
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      BPMN_HOST: ${BPMN_HOST}
      ADMIN_IP: ${ADMIN_IP:?set ADMIN_IP}
      ANTHROPIC_EGRESS: ${ANTHROPIC_EGRESS:?set ANTHROPIC_EGRESS}
      CANVAS_USER: ${CANVAS_USER:?set CANVAS_USER}
      CANVAS_HASH: ${CANVAS_HASH:?set CANVAS_HASH (scripts/server/set-canvas-password.sh)}
      AUTH_HOST: ${AUTH_HOST:?set AUTH_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # Identity provider for /mcp (OAuth). Realm and clients: scripts/server/keycloak-setup.sh
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ["start"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?run scripts/server/keycloak-secrets.sh}
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_HTTP_ENABLED: "true" # TLS ends at Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Temporary admin, used only on the very first start (create your own admin, then delete it)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?run scripts/server/keycloak-secrets.sh}
    networks: [web, keycloak]
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]

  keycloak-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-db:/var/lib/postgresql # Postgres 18+ layout (data in /var/lib/postgresql/18/docker)
    networks: [keycloak]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

volumes:
  keycloak-db:
  bpmn-data:
  caddy-data:
  caddy-config:

networks:
  web:
  keycloak:
    internal: true # the database is reachable from Keycloak only
