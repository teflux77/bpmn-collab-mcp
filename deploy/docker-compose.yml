# Production stack on the VPS: the app behind Caddy (automatic HTTPS, HTTP-01).
# Run from the repo checkout with the server-side env file (never committed):
#   docker compose -f deploy/docker-compose.yml --env-file /opt/bpmn-collab/.env up -d
# Another project = another service on the `web` network + a file in deploy/sites/.
name: bpmn-collab

services:
  app:
    image: ghcr.io/teflux77/bpmn-collab-mcp:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${BPMN_HOST:?set BPMN_HOST}
      DATA_DIR: /data
    volumes:
      - bpmn-data:/data
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      BPMN_HOST: ${BPMN_HOST}
      ADMIN_IP: ${ADMIN_IP:?set ADMIN_IP}
      ANTHROPIC_EGRESS: ${ANTHROPIC_EGRESS:?set ANTHROPIC_EGRESS}
      CANVAS_USER: ${CANVAS_USER:?set CANVAS_USER}
      CANVAS_HASH: ${CANVAS_HASH:?set CANVAS_HASH (scripts/server/set-canvas-password.sh)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  bpmn-data:
  caddy-data:
  caddy-config:

networks:
  web:
