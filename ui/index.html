<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BPMN canvas</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 1fr 320px; height: 100%; }
      #stage { position: relative; min-height: 0; }
      #canvas { height: 100%; }
      #zoom-bar { position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; gap: 2px; align-items: center;
        background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      #zoom-bar button { min-width: 32px; height: 30px; font-size: 14px; }
      #zoom-level { font-size: 12px; min-width: 44px; text-align: center; color: #444; }
      .djs-overlay-comment-bubble { pointer-events: none; }
      .bubble { pointer-events: auto; max-width: 220px; font-size: 12px; background: #fff; border: 1px solid; border-radius: 8px;
        box-shadow: 0 1px 3px rgba(0,0,0,.15); }
      .bubble.human { border-color: #e8590c; background: #fff7f0; }
      .bubble.ai { border-color: #4c6ef5; background: #f2f5ff; }
      .bubble.resolved { border-color: #bbb; background: #f4f4f4; color: #888; }
      .bubble-head { padding: 3px 7px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bubble-thread { border-top: 1px solid #ddd; padding: 4px 6px; max-height: 240px; overflow: auto; white-space: normal; }
      .bubble-item { margin: 3px 0; }
      .bubble-item.resolved { opacity: .6; }
      .bubble-thread textarea { width: 100%; box-sizing: border-box; font-size: 12px; }
      .djs-element.highlight .djs-visual > :first-child { stroke: #e8590c !important; stroke-width: 4px !important; }
      .c small.focus { cursor: pointer; text-decoration: underline dotted; }
      /* Minimap (diagram-js-minimap) in the side panel: only the frame (whole diagram) and the viewport */
      #minimap-slot { display: flex; justify-content: flex-end; margin-top: 10px; }
      #minimap-slot .djs-minimap { position: relative; top: auto; right: auto; z-index: auto; }
      /* the map frame stands for the whole diagram; the module's translucent overlay stays above it */
      #minimap-slot .djs-minimap .map { width: 220px; height: 130px; background: #eef1f4; }
      #minimap-slot .djs-minimap .map svg > g:first-child { display: none; } /* no drawing of the diagram */
      #orphans { border: 1px dashed #c92a2a; border-radius: 6px; padding: 4px 6px; margin: 6px 0; }
      @media (max-width: 760px) {
        #app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; min-height: 100%; }
        #stage { height: 62vh; }
        #side { border-left: none; border-top: 1px solid #ddd; }
      }
      #side { border-left: 1px solid #ddd; padding: 12px; overflow: auto; }
      #status { font-size: 12px; color: #666; margin-bottom: 8px; }
      .c { border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 13px; }
      .c.resolved { opacity: .5; }
      .c small { color: #777; }
      textarea { width: 100%; box-sizing: border-box; }
      .i { font-size: 12px; padding: 2px 4px; cursor: default; }
      .i[title] { cursor: pointer; }
      .i.error { color: #c92a2a; }
      .i.warning { color: #a65e00; }
      .i.dismissed { color: #999; }
      .i button { font-size: 11px; margin-left: 4px; }
      .i span[title] { cursor: pointer; }
      #back { font-size: 12px; }
      #title { font-size: 16px; margin: 4px 0; cursor: text; word-break: break-word; }
      #title:hover { background: #f3f3f3; }
      #title input { font: inherit; width: 100%; box-sizing: border-box; }
      .bar { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
      #export-panel { border: 1px solid #ddd; border-radius: 6px; padding: 6px; margin: 6px 0; }
      #export-text { font-family: ui-monospace, monospace; font-size: 11px; }
      .hint { display: block; font-size: 12px; color: #666; margin: 4px 0; }
      .c.ai-request { border-color: #4c6ef5; }
      .c .done { display: block; margin-top: 4px; color: #2b8a3e; }
      .c.open .done { color: #4c6ef5; }
      .badge { background: #e8590c; color: #fff; border-radius: 10px; font-size: 11px; padding: 0 6px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="canvas"></div>
        <div id="zoom-bar" role="toolbar" aria-label="Zoom">
          <button id="zoom-out" title="Zoom arrière">−</button>
          <span id="zoom-level">100 %</span>
          <button id="zoom-in" title="Zoom avant">+</button>
          <button id="zoom-fit" title="Ajuster à l'écran">Ajuster</button>
          <button id="zoom-reset" title="Taille réelle">100 %</button>
        </div>
      </div>
      <div id="side">
        <a id="back" href="/">← Tous les diagrammes</a>
        <h2 id="title" title="Cliquer pour renommer" tabindex="0">…</h2>
        <div id="status">Loading…</div>
        <div class="bar">
          <button id="dl-bpmn" title="Latest saved revision, standard BPMN 2.0">Télécharger .bpmn</button>
          <button id="dl-svg">Télécharger SVG</button>
          <label class="hint"><input type="checkbox" id="svg-comments" /> inclure les commentaires (SVG)</label>
        </div>
        <div class="bar">
          <label><input type="checkbox" id="c-show" checked /> Commentaires</label>
          <select id="c-status" title="Statut">
            <option value="open">ouverts</option>
            <option value="resolved">résolus</option>
            <option value="all">tous</option>
          </select>
          <select id="c-author" title="Auteur">
            <option value="all">humain + IA</option>
            <option value="human">humain</option>
            <option value="ai">IA</option>
          </select>
        </div>
        <div id="export-panel" hidden>
          <div class="hint" id="export-msg">Download blocked here: copy the XML and save it as a .bpmn file.</div>
          <textarea id="export-text" rows="8" readonly></textarea>
          <button id="export-copy">Copier</button>
          <button id="export-close">Fermer</button>
        </div>
        <div><b id="sel">No element selected</b></div>
        <textarea id="txt" rows="3" placeholder="Comment on the selected element"></textarea>
        <label class="hint"><input type="checkbox" id="for-ai" checked /> Request for the AI</label>
        <button id="add">Add comment</button>
        <div class="hint" id="hint">The AI handles open requests at its next turn: ask Claude to “process the comments of this diagram”.</div>
        <div id="ask"></div>
        <hr />
        <b id="issues-title">Validation</b>
        <div id="issues"></div>
        <hr />
        <div id="orphans" hidden></div>
        <div id="list"></div>
        <div id="minimap-slot" title="Glisser le rectangle orange pour se déplacer dans le diagramme"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
